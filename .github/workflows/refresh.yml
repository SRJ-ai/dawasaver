name: Refresh drug data

on:
  schedule:
    - cron: "17 2 * * 1"      # every Monday 02:17 UTC
  workflow_dispatch: {}         # allow manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild data/drugs.json from source
        run: python pipeline/build.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/drugs.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drugs.json
          git commit -m "chore(data): weekly refresh of drugs.json"
          git push
